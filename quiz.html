xplanation": "The physical means by which data is transmitted across a network (cables or wireless signals)"}], "freeform": [{"id": "qa_0", "type": "freeform", "question": "Where is data stored before it is fetched into the CPU?", "answer": "Data is stored in RAM (random access memory) before it is fetched into the CPU.", "marks": null}, {"id": "qa_1", "type": "freeform", "question": "Which component in the CPU is responsible for making sure the fetch-decode-execute cycle is performed correctly?", "answer": "The control unit (CU) is responsible for coordinating the fetch-decode-execute cycle by sending signals via the control bus to all components within the CPU.", "marks": null}, {"id": "qa_2", "type": "freeform", "question": "What is the role of a bus in a computer system?", "answer": "A bus is a communication pathway that carries data, addresses, or control signals between components within the CPU and between the CPU and memory. The three main buses are the address bus, data bus, and control bus.", "marks": null}, {"id": "qa_3", "type": "freeform", "question": "Why does the ALU need the accumulator (ACC)? What would happen without it?", "answer": "The ALU needs the accumulator to store interim values that are created during calculations. Without it, the ALU would not be able to store partial results while performing multi-step calculations, and it would need to constantly access RAM, which would significantly slow down processing.", "marks": null}, {"id": "qa_4", "type": "freeform", "question": "Which CPU can process more instructions at the same time: a quad core or a dual core?", "answer": "A quad-core CPU can process more instructions at the same time because it has four cores, each capable of performing a separate fetch-decode-execute cycle simultaneously, compared to only two cores in a dual-core processor.", "marks": null}, {"id": "qa_5", "type": "freeform", "question": "How many instructions per second can a dual-core 2.4 GHz CPU process?", "answer": "A dual-core 2.4 GHz CPU can process 4.8 billion instructions per second (2.4 billion per core x 2 cores).", "marks": null}, {"id": "qa_6", "type": "freeform", "question": "Explain why a larger cache can improve the performance of a CPU.", "answer": "A larger cache can store more frequently used instructions and data within the CPU. This means the CPU does not need to fetch data from the slower RAM as often, reducing access times and improving overall processing speed.", "marks": null}, {"id": "qa_7", "type": "freeform", "question": "Is a sensor an example of an input device or an output device? Explain your answer.", "answer": "A sensor is an example of an input device because it captures data from the surrounding environment and sends it into the computer system for processing. It inputs analogue data such as temperature, light levels, or pressure readings.", "marks": null}, {"id": "qa_8", "type": "freeform", "question": "State two differences between RAM and ROM.", "answer": "(1) RAM is volatile (loses contents when power is off) while ROM is non-volatile (retains contents without power). (2) RAM stores data and programs currently in use that constantly change, while ROM stores fixed boot-up programs like the BIOS that do not normally change.", "marks": null}, {"id": "qa_9", "type": "freeform", "question": "Identify the three main types of secondary storage and give one example of each.", "answer": "(1) Magnetic storage \u2014 e.g. hard disk drive (HDD). (2) Optical storage \u2014 e.g. CD, DVD, or Blu-ray. (3) Solid-state storage \u2014 e.g. solid state drive (SSD) or USB flash memory drive.", "marks": null}, {"id": "qa_10", "type": "freeform", "question": "Identify the name of the component where an instruction is stored immediately before it is fetched into the CPU.", "answer": "The instruction is stored in RAM (random access memory) immediately before it is fetched into the CPU.", "marks": null}, {"id": "qa_11", "type": "freeform", "question": "Identify the name of the component that stores the address of the next instruction that will be processed.", "answer": "The program counter (PC) stores the address of the next instruction that will be processed.", "marks": null}, {"id": "qa_12", "type": "freeform", "question": "Give the most appropriate sensor for each scenario: (a) monitoring pollution in a river, (b) counting competitors finishing a race, (c) detecting a person approaching an automatic door.", "answer": "(a) A pH sensor \u2014 to measure the pH level of the water and detect pollution. (b) A pressure sensor or infra-red sensor \u2014 to detect when a competitor crosses the finish line. (c) A proximity sensor or infra-red sensor \u2014 to detect when a person is approaching the door and trigger it to open.", "marks": null}], "truefalse": [{"id": "tf_0", "type": "truefalse", "statement": "Barcode scanner \u2014 Scans barcodes to read the data stored within them (e.g. supermarket pricing)", "correct": true, "explanation": "Barcode scanner \u2014 Scans barcodes to read the data stored within them (e.g. supermarket pricing)"}, {"id": "tf_1", "type": "truefalse", "statement": "Digital camera \u2014 Captures images and video as digital data", "correct": true, "explanation": "Digital camera \u2014 Captures images and video as digital data"}, {"id": "tf_2", "type": "truefalse", "statement": "Keyboard \u2014 Allows text and commands to be entered as character data", "correct": true, "explanation": "Keyboard \u2014 Allows text and commands to be entered as character data"}, {"id": "tf_3", "type": "truefalse", "statement": "Microphone \u2014 Captures sound as audio data", "correct": true, "explanation": "Microphone \u2014 Captures sound as audio data"}, {"id": "tf_4", "type": "truefalse", "statement": "Optical mouse \u2014 Detects movement and button clicks for cursor control", "correct": true, "explanation": "Optical mouse \u2014 Detects movement and button clicks for cursor control"}, {"id": "tf_5", "type": "truefalse", "statement": "QR code scanner \u2014 Reads QR codes to obtain embedded data", "correct": true, "explanation": "QR code scanner \u2014 Reads QR codes to obtain embedded data"}, {"id": "tf_6", "type": "truefalse", "statement": "Scanner (2D and 3D) \u2014 Captures printed documents or physical objects as digital data", "correct": true, "explanation": "Scanner (2D and 3D) \u2014 Captures printed documents or physical objects as digital data"}, {"id": "tf_7", "type": "truefalse", "statement": "Touch screen \u2014 Allows direct interaction through screen contact; three types: resistive, capacitive, and infra-red", "correct": true, "explanation": "Touch screen \u2014 Allows direct interaction through screen contact; three types: resistive, capacitive, and infra-red"}, {"id": "tf_8", "type": "truefalse", "statement": "Actuator \u2014 Outputs an action, often movement, to control another device (e.g. turning a light on/off in an automated system)", "correct": true, "explanation": "Actuator \u2014 Outputs an action, often movement, to control another device (e.g. turning a light on/off in an automated system)"}, {"id": "tf_9", "type": "truefalse", "statement": "Digital light processing (DLP) projector \u2014 Projects images onto a surface using light", "correct": true, "explanation": "Digital light processing (DLP) projector \u2014 Projects images onto a surface using light"}, {"id": "tf_10", "type": "truefalse", "statement": "Inkjet printer \u2014 Produces printed output by spraying ink onto paper", "correct": true, "explanation": "Inkjet printer \u2014 Produces printed output by spraying ink onto paper"}, {"id": "tf_11", "type": "truefalse", "statement": "Laser printer \u2014 Produces printed output using laser and toner technology", "correct": true, "explanation": "Laser printer \u2014 Produces printed output using laser and toner technology"}, {"id": "tf_12", "type": "truefalse", "statement": "Light emitting diode (LED) screen \u2014 Displays visual output using LED technology", "correct": true, "explanation": "Light emitting diode (LED) screen \u2014 Displays visual output using LED technology"}, {"id": "tf_13", "type": "truefalse", "statement": "Liquid crystal display (LCD) projector \u2014 Projects images using LCD technology", "correct": true, "explanation": "Liquid crystal display (LCD) projector \u2014 Projects images using LCD technology"}, {"id": "tf_14", "type": "truefalse", "statement": "Liquid crystal display (LCD) screen \u2014 Displays visual output using LCD technology", "correct": true, "explanation": "Liquid crystal display (LCD) screen \u2014 Displays visual output using LCD technology"}]};
let allQ = [];
let idx = 0;
let score = 0;
let answered = 0;

function init() {
  allQ = [...(DATA.mcq||[]), ...(DATA.truefalse||[]), ...(DATA.freeform||[])];
  if (!allQ.length) { document.getElementById('scoreDisplay').textContent = 'No questions available.'; return; }
  idx = 0; score = 0; answered = 0;
  renderAll();
  showQuestion(0);
}

function renderAll() {
  const c = document.getElementById('questionsContainer');
  c.innerHTML = '';
  allQ.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q_' + i;

    let typeLabel = q.type === 'mcq' ? 'Multiple Choice' : q.type === 'truefalse' ? 'True / False' : 'Written Answer';
    let inner = `<div class="q-number">Question ${i+1} of ${allQ.length}</div>`;
    inner += `<span class="q-type">${typeLabel}</span>`;

    if (q.type === 'mcq') {
      inner += `<div class="q-text">${q.question}</div>`;
      q.options.forEach((o, oi) => {
        inner += `<button class="option" data-qi="${i}" data-oi="${oi}" onclick="answerMCQ(${i},${oi})">${o}</button>`;
      });
      inner += `<div class="explanation" id="expl_${i}">${q.explanation||''}</div>`;
    } else if (q.type === 'truefalse') {
      inner += `<div class="q-text">${q.statement}</div>`;
      inner += `<div class="tf-btns"><button data-qi="${i}" data-val="true" onclick="answerTF(${i},true)">True</button>`;
      inner += `<button data-qi="${i}" data-val="false" onclick="answerTF(${i},false)">False</button></div>`;
      inner += `<div class="explanation" id="expl_${i}">Correct statement: ${q.explanation||''}</div>`;
    } else {
      inner += `<div class="q-text">${q.question}</div>`;
      inner += `<textarea class="freeform-area" id="ans_${i}" placeholder="Type your answer..."></textarea>`;
      inner += `<div class="explanation" id="expl_${i}"><b>Model answer:</b> ${q.answer||''}</div>`;
    }

    inner += `<div class="nav-btns">`;
    if (q.type === 'freeform') inner += `<button class="btn-reveal" onclick="revealFreeform(${i})">Show Answer</button>`;
    else inner += `<span></span>`;
    inner += `<button class="btn-next" id="next_${i}" onclick="nextQ()">${i===allQ.length-1?'Finish':'Next →'}</button>`;
    inner += `</div>`;

    card.innerHTML = inner;
    c.appendChild(card);
  });
}

function showQuestion(n) {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('q_' + n);
  if (card) card.classList.add('active');
  document.getElementById('progressFill').style.width = ((n+1)/allQ.length*100) + '%';
  document.getElementById('scoreDisplay').textContent = `Question ${n+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function answerMCQ(qi, oi) {
  const q = allQ[qi];
  const btns = document.querySelectorAll(`button[data-qi="${qi}"]`);
  btns.forEach(b => { b.disabled = true; b.classList.remove('selected'); });
  btns[oi].classList.add('selected');
  if (oi === q.correct) { btns[oi].classList.add('correct'); score++; }
  else { btns[oi].classList.add('wrong'); btns[q.correct].classList.add('correct'); }
  answered++;
  document.getElementById('expl_' + qi).classList.add('show');
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function answerTF(qi, val) {
  const q = allQ[qi];
  const btns = document.querySelectorAll(`button[data-qi="${qi}"]`);
  btns.forEach(b => b.disabled = true);
  const correct = val === q.correct;
  btns.forEach(b => {
    if (String(b.dataset.val) === String(q.correct)) b.classList.add('correct');
    if (b.dataset.val === String(val) && !correct) b.classList.add('wrong');
  });
  if (correct) score++;
  answered++;
  document.getElementById('expl_' + qi).classList.add('show');
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function revealFreeform(qi) {
  document.getElementById('expl_' + qi).classList.add('show');
  answered++;
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function nextQ() {
  idx++;
  if (idx >= allQ.length) { showResults(); return; }
  showQuestion(idx);
}

function showResults() {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const pct = answered > 0 ? Math.round(score/answered*100) : 0;
  document.getElementById('finalScore').textContent = pct + '%';
  let grade = pct >= 90 ? 'Outstanding!' : pct >= 70 ? 'Great work!' : pct >= 50 ? 'Good effort — keep studying!' : 'Review the material and try again.';
  document.getElementById('gradeText').textContent = grade + ` (${score}/${answered} correct)`;
  document.getElementById('resultsCard').style.display = 'block';
  document.getElementById('progressFill').style.width = '100%';
  // Save to localStorage for dashboard
  try {
    const sessions = JSON.parse(localStorage.getItem('sf_quiz_sessions') || '[]');
    sessions.push({ date: new Date().toISOString(), score, total: answered, pct });
    localStorage.setItem('sf_quiz_sessions', JSON.stringify(sessions));
  } catch(e) {}
}

function restart() {
  document.getElementById('resultsCard').style.display = 'none';
  init();
}

init();
</script>
